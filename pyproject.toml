[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codex_rc"
version = "0.2.0"
description = "Drive a local Codex CLI from Discord via the official codex app-server JSON-RPC protocol."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
license-files = ["LICENSE"]
authors = [{ name = "Codex Remote Control Contributors" }]
keywords = ["codex", "discord", "remote-control", "json-rpc", "tmux"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Communications :: Chat",
]

dependencies = [
    "pydantic>=2.8",
    "anyio>=4.4",
    "libtmux>=0.39",
    "python-dotenv>=1.0",
    "discord.py>=2.4",
    "websockets>=13.0",
    # discord.py 2.4 still imports stdlib `audioop`, which Python 3.13 dropped.
    # audioop-lts is a maintained drop-in replacement; voice features unused
    # but the import path needs to resolve at module load.
    "audioop-lts>=0.2; python_version >= '3.13'",
]

[project.optional-dependencies]
dev = [
    "datamodel-code-generator>=0.26",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.11",
]

[project.scripts]
codex-rc = "codex_rc:cli_setup"
codex-rc-discord = "codex_rc:cli_discord"
codex-rc-gateway = "codex_rc.gateway:main"

[project.urls]
Homepage = "https://github.com/creed3466/codex_remote_with_harness"
Repository = "https://github.com/creed3466/codex_remote_with_harness"
Issues = "https://github.com/creed3466/codex_remote_with_harness/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_rc"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "-m", "not integration",
]
markers = [
    "unit: pure logic, no IO/network/subprocess (default)",
    "integration: spawns codex CLI or other heavy IO; skipped by default",
]
# discord.py 2.4 still imports the stdlib audioop module which is gone in 3.13;
# voice features are unused so the warning is noise on the 3.13 CI matrix row.
filterwarnings = [
    "ignore:'audioop' is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["src/codex_rc"]
omit = [
    "src/codex_rc/protocol/*",       # auto-generated Pydantic
    "src/codex_rc/setup_wizard.py",  # interactive prompts; smoke-tested only
]
branch = true

[tool.coverage.report]
fail_under = 65

exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["src/codex_rc/protocol/"]
