name: Bug report
description: Report a reproducible issue with installation, setup, or runtime behavior.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Keep the environment section small and redacted.
  - type: input
    id: os
    attributes:
      label: OS
      description: e.g. macOS 15.4, Ubuntu 24.04
      placeholder: macOS 15.4 (x86_64)
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      description: `python --version`
      placeholder: 3.12.6
    validations:
      required: true
  - type: input
    id: codex_cli
    attributes:
      label: Codex CLI version
      description: `codex --version`
      placeholder: 0.5.0
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Transport
      description: `CODEX_RC_TRANSPORT`
      options:
        - ws
        - stdio
        - other
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command used
      description: What command did you run? (Discord command or CLI command)
      placeholder: /codex start ~/Project/my-repo
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: "e.g. bot acknowledged start and posted session status"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: "e.g. command timed out and no response in channel"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redacted logs from console / data/logs/errors or terminal session.
      placeholder: Paste a short excerpt only
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Redacted env excerpt
      description: Remove secrets, keep relevant keys only.
      placeholder: |
        CODEX_RC_DISCORD_GUILD_ID=
        CODEX_RC_TRANSPORT=ws
        CODEX_RC_EVENT_LOG_MODE=errors
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1) Run codex-rc-discord
        2) Send /codex start ...
        3) Observe...
